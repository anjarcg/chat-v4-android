name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-34 build-tools;34.0.0' }
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build.log }
      - uses: actions/upload-artifact@v4
        if: success()
        with: { name: chat-v4-debug-apk, path: app/build/outputs/apk/debug/*.apk }
